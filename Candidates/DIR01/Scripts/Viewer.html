<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIR01 · 多面骨架研究台</title>
<style> *{box-sizing:border-box}body{margin:0;background:#e7edf0;color:#223845;font:14px/1.5 "Microsoft YaHei",sans-serif}header{padding:15px 24px;background:#f8fbfc;border-bottom:1px solid #b4c5cf;display:flex;align-items:baseline;gap:18px}h1{font-size:21px;margin:0}header span{color:#527080}main{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px}aside{background:#f8fbfc;padding:16px;max-height:calc(100vh - 95px);overflow:auto;border:1px solid #bbcbd3}label{display:block;margin:10px 0}select,input[type=range]{width:100%}select,button{font:inherit;padding:6px;border:1px solid #9cb3c0;border-radius:3px;background:white;color:#203b4b}button{cursor:pointer}button:hover{background:#d5e8f0}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ddac43}input[type=checkbox]{accent-color:#246a8d}.modes{display:grid;grid-template-columns:1fr 1fr;gap:5px}.modes button.active{background:#246a8d;color:white}.stage{position:relative;min-height:620px;height:calc(100vh - 185px);background:#213845;border:1px solid #486170;overflow:hidden}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.stage #overlay{pointer-events:none}#note{padding:10px 14px;background:#fff9e8;border-left:4px solid #d4a645;margin-bottom:12px}#facts{font:12px/1.6 Consolas,monospace;white-space:pre-wrap;background:#f8fbfc;padding:10px;border:1px solid #bbcbd3;margin-top:10px}.small{font-size:12px;color:#587180}.row{display:flex;gap:6px}hr{border:0;border-top:1px solid #cfdae0;margin:15px 0}@media(max-width:850px){main{grid-template-columns:1fr}aside{max-height:none}.stage{height:650px}header{flex-wrap:wrap}} </style>
<header><h1>多面骨架研究台</h1><span>DIR01 / Spine 4.1.23 数据 · 4.1.56 Runtime</span><span class="small">本机研究副本 · 不接战斗 · 不改源文件</span></header>
<main><aside><strong>01 / 实验模式</strong><div class="modes" id="modes"><button data-mode="A">A 全分支</button><button data-mode="B">B 只播动作</button><button data-mode="C">C 只播方向</button><button data-mode="D">D 双轨＋源裁切</button><button data-mode="E">E 显隐对照</button><button data-mode="F">F 连续转向</button></div>
<label>动作<select id="action"></select></label><div class="row"><button id="play">播放</button><button id="step">前进 1/30 秒</button><button id="replay">重播动作</button></div><label>动作进度 <output id="progressText">0%</output><input id="progress" type="range" min="0" max="999" value="250"></label><div class="row" id="samples"><button data-progress="0">0%</button><button data-progress="250">25%</button><button data-progress="500">50%</button><button data-progress="750">75%</button><button data-progress="999">末帧</button></div>
<hr><strong>02 / 方向与显示</strong><label>方向面<select id="face"><option>左</option><option>左上</option><option>上</option><option>左下</option><option>下</option></select></label><label><input id="mirror" type="checkbox">镜像（不改变逻辑左右手身份）</label><label>连续角度 <output id="angleText">0°</output><input id="angle" type="range" min="0" max="360" value="0" step="0.1"></label><label>选面策略<select id="policy"><option value="original">原作八向表：atan2(x,z)</option><option value="prototype">原型阈值：原始 -heading 角度</option></select></label><label>切面 mix（秒）<select id="mix"><option>0</option><option>0.15</option><option>0.4</option></select></label>
<label><input id="direction" type="checkbox" checked>方向轨（轨 9）</label><label><input id="clipping" type="checkbox" checked>源 Spine 裁切附件</label><label><input id="prototype" type="checkbox">原型清理非选中中文分支</label><label><input id="cull" type="checkbox">原作矩形剔除的独立等效对照</label><label><input id="aux" type="checkbox">暂隐藏拼音辅助分支（可逆实验）</label><label><input id="constraints" type="checkbox" checked>源约束</label>
<hr><strong>03 / 观察</strong><label>观察范围<select id="zoom"><option value="all">全部骨架</option><option value="window">原点显示窗</option><option value="detail">角色近景</option></select></label><label><input id="labels" type="checkbox" checked>分支名／原点／裁切窗</label><label><input id="hands" type="checkbox">每面左右手名称候选点</label><p class="small">金色＝五个中文方向主体；蓝色＝拼音辅助分支。矩形剔除只模拟渲染显隐，不是原游戏运行。方向与动作分别控制，不因转向重播动作。</p></aside>
<section><div id="note">加载本机资源…</div><div class="stage"><canvas id="stage"></canvas><canvas id="overlay"></canvas></div><div id="facts" aria-live="polite">初始化中</div></section></main><script src="/vendor.js"></script><script src="/viewer.js"></script></html>
